# STM32C593RET6 (C5) + ST-LINK —— OpenOCD 板卡配置
#
# OpenOCD: C:\CLionToolchains\DevEnv\openocd-c5\bin\openocd.exe
#          0.12.0+dev-00664-g72f14cee6 (2026-04-16)，取自 STM32CubeIDE 2.2.0
#
# ✅ 已实机验证：能烧录（program → Verify OK → reset）、能 GDB load、能下断点。
#
# 命令行用法：
#   C:\CLionToolchains\DevEnv\openocd-c5\bin\openocd.exe ^
#     -s C:\CLionToolchains\DevEnv\openocd-c5\share\openocd\scripts ^
#     -f C:\CLionToolchains\DevEnv\stm32c5_stlink.cfg ^
#     -c "program {.../cmake-build-debug/DM_MC01_V2.elf} verify reset exit"
#
# CLion：Settings > Embedded Development
#   OpenOCD Location  = C:\CLionToolchains\DevEnv\openocd-c5\bin\openocd.exe
#   Board config file = C:\CLionToolchains\DevEnv\stm32c5_stlink.cfg
# 新建 Run Configuration > OpenOCD Download & Run：
#   GDB 3333 / Telnet 4444 / Reset init / Download Updated only

# 内部 Flash 的 loader，按 DBGMCU die id 选择：
#   0x44E -> STM32C5[56]x.xldr
#   0x44F -> STM32C5[34]x.xldr
#   0x45A -> STM32C5[9A]x.xldr   <- 本板 STM32C593RET6 实测 die id 就是 0x45A
set INTERNAL_FLASH_LOADERS {C:/CLionToolchains/DevEnv/stm32c5_loaders/STM32C5[9A]x.xldr}

source [find interface/stlink-dap.cfg]
source [find target/stm32c5x.cfg]

reset_config none
